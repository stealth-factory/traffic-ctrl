name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Version and changelog
    runs-on: ubuntu-latest
    env:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      release-sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Report missing release token
        if: env.RELEASE_PLEASE_TOKEN == ''
        run: echo "::warning::RELEASE_PLEASE_TOKEN is required by the enterprise Actions policy; see docs/RELEASING.md"

      - name: Create or update the release PR
        if: env.RELEASE_PLEASE_TOKEN != ''
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ env.RELEASE_PLEASE_TOKEN }}

  build:
    name: Package (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out released revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.release-sha }}

      - name: Build release executables
        run: swift build -c release

      - name: Verify commands and version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          .build/release/traffic-ctrl --help >/dev/null
          .build/release/trctrl --help >/dev/null
          test "$(.build/release/traffic-ctrl --version)" = "traffic-ctrl ${RELEASE_VERSION}"
          test "$(.build/release/trctrl --version)" = "traffic-ctrl ${RELEASE_VERSION}"

      - name: Create release archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          package="traffic-ctrl-v${RELEASE_VERSION}-macos-${RELEASE_ARCH}"
          mkdir -p "dist/${package}"
          cp .build/release/traffic-ctrl .build/release/trctrl README.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          (cd dist && shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256")

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: traffic-ctrl-macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish-assets:
    name: Publish release assets
    needs: [release-please, build]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@v4
        with:
          pattern: traffic-ctrl-macos-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256

      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
