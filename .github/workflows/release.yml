name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Version and changelog
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      release-sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Create or update the release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}

  build:
    name: Package (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS archives build on the org's self-hosted Apple silicon Macs,
          # never on GitHub-hosted macOS runners. Intel is cross-compiled.
          - platform: macos
            arch: arm64
            rust-target: aarch64-apple-darwin
          - platform: macos
            arch: x86_64
            rust-target: x86_64-apple-darwin
          - platform: linux
            arch: x86_64
            rust-target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-latest' || fromJSON(vars.MACOS_RUNS_ON || '["self-hosted","macOS","ARM64"]') }}
    steps:
      - name: Check out released revision
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.release-sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Build release executables
        run: cargo build --release --workspace --locked --target ${{ matrix.rust-target }}

      - name: Verify commands and version
        run: .github/scripts/verify-commands.sh "target/${{ matrix.rust-target }}/release" ${{ matrix.arch }} "${{ needs.release-please.outputs.version }}"

      - name: Create release archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          RELEASE_ARCH: ${{ matrix.arch }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          BIN: target/${{ matrix.rust-target }}/release
        run: |
          set -euo pipefail
          package="traffic-ctrl-v${RELEASE_VERSION}-${RELEASE_PLATFORM}-${RELEASE_ARCH}"
          rm -rf dist
          mkdir -p "dist/${package}"
          cp "$BIN/traffic-ctrl" "$BIN/trctrl" README.md "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          if command -v shasum >/dev/null; then
            (cd dist && shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256")
          else
            (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")
          fi

      - name: Upload packaged executable
        uses: actions/upload-artifact@v4
        with:
          name: traffic-ctrl-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish-assets:
    name: Publish release assets
    needs: [release-please, build]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download packaged executables
        uses: actions/download-artifact@v4
        with:
          pattern: traffic-ctrl-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cat dist/*.sha256 > dist/SHA256SUMS
          rm dist/*.sha256

      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz

      - name: Attach assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: gh release upload "${RELEASE_TAG}" dist/* --clobber
